# Where to bid, and how many days it takes to get a kit there.
#
# The geography is a COMPETITION gradient, not a cost one: the same kit sells
# for more where fewer firms bother to bid. Sao Paulo has the most kit tenders
# in the country and the worst prices.
#
# Supply is SP-only and that is arithmetic, not preference: LC 123 art. 13
# par. 1 XIII (h) charges a Simples optante the internal-minus-interstate ICMS
# difference, ~6 points, so an out-of-state supplier must beat an SP one by
# more than 6% to be cheaper.
#
# transit_days: MEASURED 2026-09-19 for eight UFs -- Correios PAC balcao,
# public calculator, SP 03005-000 to the CAPITAL CEP, in dias uteis (see
# data/freight.md and data/cost_freight.csv). Interior CEPs may differ and
# were not measured. Every other UF is deliberately null so rule 5 cannot
# wave a tender through on a number nobody measured: a null transit day
# makes rule 5 return VERIFICAR, not PASS.

home_uf: SP

# days needed = buy + assemble + transit. buy_and_assemble_days is the
# founder's own floor for small lots; a co-packer leg (config/capital.yaml)
# is ADDED on top for lots above self_pack_max_kits.
buy_and_assemble_days: 3

target:
  MG: {priority: 1, transit_days: 5}
  MA: {priority: 1, transit_days: 8}
  BA: {priority: 1, transit_days: 6}
  CE: {priority: 1, transit_days: 7}
  PE: {priority: 1, transit_days: 6}
  SE: {priority: 1, transit_days: 8}
  PA: {priority: 1, transit_days: 8}
  RN: {priority: 1, transit_days: 7}

secondary:
  PB: {priority: 2, transit_days: null}
  AL: {priority: 2, transit_days: null}
  PI: {priority: 2, transit_days: null}
  GO: {priority: 2, transit_days: null}
  TO: {priority: 2, transit_days: null}
  RJ: {priority: 2, transit_days: null}
  PR: {priority: 2, transit_days: null}
  SC: {priority: 2, transit_days: null}
  RS: {priority: 2, transit_days: null}
  AM: {priority: 2, transit_days: null}   # Coari/AM was 34,8% of the clearing
                                          # pool: huge, and a concentration risk
  AC: {priority: 3, transit_days: null}
  RO: {priority: 3, transit_days: null}
  RR: {priority: 3, transit_days: null}
  AP: {priority: 3, transit_days: null}
  DF: {priority: 3, transit_days: null}

# De-prioritised: most competition, worst prices.
deprioritised:
  SP: {priority: 4, transit_days: 1}
  ES: {priority: 4, transit_days: null}
  MT: {priority: 4, transit_days: null}
  MS: {priority: 4, transit_days: null}
